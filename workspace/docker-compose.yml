services:
  postgres:
    image: postgres:16-alpine
    container_name: rfa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfa
      POSTGRES_PASSWORD: rfa
      POSTGRES_DB: rfa
      # Deterministic collation keeps seeded ordering reproducible across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "55432:5432"
    volumes:
      - rfa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfa -d rfa"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: rfa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  rfa-postgres-data:
